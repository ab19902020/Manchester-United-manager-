name: Android app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # the APK's versionCode comes from the commit's time, so an
          # update always installs over the one before it
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The runner already carries the Android SDK. The setup-android action
      # used to sit here and began failing before a line of ours ran: it asks
      # sdkmanager for a package ("tools") that no longer exists. All the build
      # needs is the platform it compiles against, so ask for exactly that.
      - name: Android SDK platform 36
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          MANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$MANAGER" --licenses > /dev/null || true
          "$MANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
      - name: Release signing key (only when the repository has one)
        env:
          RB_KEYSTORE_BASE64: ${{ secrets.RB_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RB_KEYSTORE_BASE64" ]; then
            echo "$RB_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RB_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No RB_KEYSTORE_BASE64 secret: the APK is signed with a throwaway debug key."
          fi
      - name: Build the APK
        working-directory: android
        env:
          RB_KEYSTORE_PASSWORD: ${{ secrets.RB_KEYSTORE_PASSWORD }}
          RB_KEY_ALIAS: ${{ secrets.RB_KEY_ALIAS }}
          RB_KEY_PASSWORD: ${{ secrets.RB_KEY_PASSWORD }}
        # the APK is for installing by hand; the bundle (.aab) is what Google Play takes
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: the-results-business-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: the-results-business-play-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
