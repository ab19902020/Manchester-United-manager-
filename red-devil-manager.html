<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080c09">
  <title>The Results Business</title>
  <!-- THE GAME MOVED TO index.html, AND THIS IS HERE FOR THE PEOPLE WHO
       HAVE THE OLD ADDRESS.

       CrazyGames loads `index.html` and nothing else, so the game itself
       is now that file rather than a redirect pointing at it — one hop
       fewer, and one fewer thing to be wrong on their platform.

       This shim is the other direction: anyone who bookmarked
       red-devil-manager.html, or installed the game while the manifest
       still pointed here, would otherwise get a 404 on the address they
       already have. It costs a kilobyte and it does not expire. -->
  <meta http-equiv="refresh" content="0;url=index.html">
  <link rel="canonical" href="index.html">
  <style>
    html,body{height:100%;margin:0;background:#080c09;color:#eef3ee;font-family:system-ui,sans-serif}
    body{display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
    a{color:#fbe122;font-weight:800}
  </style>
</head>
<body>
  <main>
    <h1>The Results Business</h1>
    <p>Opening your football management career…</p>
    <p><a href="index.html">Tap here if the game does not open.</a></p>
  </main>
</body>
</html>
